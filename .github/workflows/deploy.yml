name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy-vercel:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vercel/action@v28
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
          scope: ${{ secrets.VERCEL_ORG_ID }}

  deploy-render:
    name: Deploy API to Render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Render
        run: |
          curl --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            --data '{"gitCommitSha":"'${{ github.sha }}'"}' \
            https://api.render.com/v1/services/srv_${{ secrets.RENDER_SERVICE_ID_API }}/deploys

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-vercel, deploy-render, test]
    if: always()
    steps:
      - name: Check Deployment Status
        run: |
          if [ "${{ needs.deploy-vercel.result }}" = "success" ] && [ "${{ needs.deploy-render.result }}" = "success" ]; then
            echo "✅ Deployment successful!"
            exit 0
          else
            echo "❌ Deployment failed!"
            exit 1
          fi
