<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Five-blade aperture seal with one blade omitted as the gate opening -->
  <defs>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; }
      }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Blade 1 (top-right, #2F8FFF) -->
  <path d="M 50 50 L 72 30 Q 80 35 78 50 Z" fill="#2F8FFF"/>

  <!-- Blade 2 (right, #1B4D99) -->
  <path d="M 50 50 L 78 50 Q 80 65 72 70 Z" fill="#1B4D99"/>

  <!-- Blade 3 (bottom-right, #2F8FFF) -->
  <path d="M 50 50 L 72 70 Q 65 80 50 78 Z" fill="#2F8FFF"/>

  <!-- Blade 4 (bottom-left, #1B4D99) -->
  <path d="M 50 50 L 50 78 Q 35 80 28 70 Z" fill="#1B4D99"/>

  <!-- Blade 5 (top-left, #2F8FFF) -->
  <path d="M 50 50 L 28 30 Q 35 20 50 22 Z" fill="#2F8FFF"/>

  <!-- Gate opening (top, omitted blade) — transparent -->

  <!-- Center dot (pulsing) -->
  <circle cx="50" cy="50" r="6" fill="#2F8FFF" class="pulse"/>

  <!-- Hex border for definition -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#2F8FFF" stroke-width="1" opacity="0.2"/>
</svg>
