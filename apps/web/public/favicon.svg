<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; }
      }
      .pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Five-blade aperture seal optimized for favicon -->
  <path d="M 50 50 L 72 30 Q 80 35 78 50 Z" fill="#2F8FFF"/>
  <path d="M 50 50 L 78 50 Q 80 65 72 70 Z" fill="#1B4D99"/>
  <path d="M 50 50 L 72 70 Q 65 80 50 78 Z" fill="#2F8FFF"/>
  <path d="M 50 50 L 50 78 Q 35 80 28 70 Z" fill="#1B4D99"/>
  <path d="M 50 50 L 28 30 Q 35 20 50 22 Z" fill="#2F8FFF"/>

  <!-- Center dot -->
  <circle cx="50" cy="50" r="6" fill="#2F8FFF" class="pulse"/>
</svg>
